name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: XianyuMonitor-Windows
          path: dist/XianyuMonitor-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Windows 最新版
          body: 自动构建的 Windows 版本。下载 ZIP、完整解压，然后运行 XianyuMonitor.exe。
          files: dist/XianyuMonitor-Windows.zip
          make_latest: true
